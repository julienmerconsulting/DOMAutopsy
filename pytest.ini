[pytest]
# T15 : skip 'slow' PAR DEFAUT. Pour les inclure : python -m pytest -m ""
# (marker vide desactive le filtre) ou python -m pytest -m slow pour ne
# lancer QUE les slow.
addopts = -m "not slow"
markers =
    slow: tests longs (pip resolve, telechargements binaires runtime, downloads Chromium) skippes par defaut
