<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOMAutopsy</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>DOMAutopsy</h1>
    <span class="tagline">Capture &middot; Analyse &middot; Genere</span>
  </div>
  <div class="header-info">
    <span class="badge" id="runBadge" hidden>run: <code id="runIdLabel">—</code> &middot; port: <code id="portLabel">—</code></span>
    <span class="badge active-runs" id="activeRunsBadge">0 run actif</span>
    <span class="byline">JMer Consulting</span>
  </div>
</header>

<main>
  <section class="panel form-panel">
    <h2>Nouveau run</h2>
    <form id="runForm">
      <label>
        URL de depart
        <input type="url" id="url" placeholder="https://exemple.com" required>
      </label>
      <label>
        Description du parcours
        <textarea id="task" rows="4" placeholder="Tape 'Zinedine Zidane' dans la barre de recherche, valide avec Entree, puis clique sur le premier resultat" required></textarea>
      </label>
      <div class="row">
        <label>
          Format de sortie
          <select id="output_format"></select>
        </label>
        <label>
          Provider LLM
          <select id="provider">
            <option value="openai" selected>OpenAI</option>
            <option value="groq">Groq</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>
          Modele (optionnel)
          <input type="text" id="model" placeholder="auto selon provider">
        </label>
        <label>
          Max steps
          <input type="number" id="max_steps" value="25" min="1" max="100">
        </label>
      </div>
      <details>
        <summary>Reglages avances (timing SPA)</summary>
        <div class="row">
          <label>min_wait
            <input type="number" id="min_wait" value="2" step="0.5" min="0">
          </label>
          <label>max_wait
            <input type="number" id="max_wait" value="15" step="1" min="1">
          </label>
          <label>network_idle
            <input type="number" id="network_idle" value="3" step="0.5" min="0">
          </label>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="headless" checked>
          Mode headless (Chromium invisible, requis pour multi-onglets)
        </label>
      </details>
      <div class="actions">
        <button type="submit" id="submitBtn">Lancer le run</button>
        <button type="button" id="stopBtn" disabled>Stopper</button>
      </div>
    </form>
  </section>

  <section class="panel screen-panel">
    <h2>Chromium en direct <span class="status-dot" id="screenStatus"></span></h2>
    <div class="canvas-wrapper">
      <canvas id="screen" width="1280" height="720"></canvas>
      <div class="canvas-empty" id="canvasEmpty">En attente du run...</div>
    </div>
  </section>

  <section class="panel log-panel">
    <h2>Log Python <span class="status-dot" id="logStatus"></span></h2>
    <pre id="log" class="log-box">En attente...</pre>
    <div class="actions">
      <button id="reportBtn" disabled>Voir le rapport HTML</button>
      <button id="clearLogBtn" type="button">Effacer log</button>
    </div>
  </section>
</main>

<script src="/web/app.js"></script>
</body>
</html>
