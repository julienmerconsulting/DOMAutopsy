name: tests

# Trigger sur push et pull_request sur toutes les branches pour attraper
# les regressions avant merge. Manual workflow_dispatch pour re-run a la
# demande.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Un seul job en cours par branche : annule le precedent si nouveau push.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Python 3.12 + Node + Chromium (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Setup Python 3.12 (version cible du projet) ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # --- Setup Node 20 LTS (match runtime_installer MANIFEST_TARGET) ---
      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --- Install deps Python strictes (matche requirements.txt aligne
      # sur browser-use==0.12.9). Isole pip-tools warnings avec --quiet. ---
      - name: Install Python deps (production)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet

      - name: Install Python deps (test only)
        run: pip install -r requirements-dev.txt --quiet

      # --- Playwright Python installe Chromium dans le cache utilisateur ---
      - name: Install Chromium (Playwright Python)
        run: python -m playwright install --with-deps chromium

      # --- npm ci lit package-lock.json - fige @playwright/test==1.57.0 ---
      - name: npm ci (matches package-lock)
        run: npm ci

      # --- Verification cache Chromium partage : channel:'chromium' dans
      # playwright.config.ts doit trouver le binaire installe ci-dessus ---
      - name: Verify Playwright can find Chromium
        run: npx playwright test --list --reporter=list || true

      # --- Suite complete : 103 tests (unit + integration + E2E reel) ---
      - name: Run pytest suite
        run: python -m pytest tests/ -v

      # --- Bonus : lance aussi les tests slow (pip dry-run resolution)
      # dans un job separe pour attraper les futures desynchros deps.
      - name: Run slow tests (pip dry-run consistency check)
        run: python -m pytest tests/ -m slow -v
        continue-on-error: false

      # --- Failure artifacts : si un test E2E crashe, on garde les
      # artefacts Playwright (screenshots, traces, video) pour debug. ---
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts-${{ github.run_id }}
          path: |
            runs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
